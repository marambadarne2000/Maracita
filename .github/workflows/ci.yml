name: Verify Maracita

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: node scripts/check-migrations.mjs
      - run: npm run test:regression
      - run: npm run build
